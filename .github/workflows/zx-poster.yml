name: Zoho Explained poster

# Posts the day's Zoho Explained episode at exactly 00:00 IST (18:30 UTC).
# Starts at 18:05 and 18:12 UTC (two starts in case GitHub delays or drops one),
# then waits inside the job until 18:30:00 UTC. Plain script, no AI.
# Also runs once whenever the poster script, this file or the queue changes
# (so a test slot can be posted at an exact time).

on:
  schedule:
    - cron: "5 18 * * *"
    - cron: "12 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/zx_poster.py
      - .github/workflows/zx-poster.yml
      - queue/zx_trigger.txt

permissions:
  contents: write

concurrency:
  group: zx-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            queue
            tools
            .github
      - name: Post Zoho Explained episode
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MAKE_BASE: https://eu1.make.com/api/v2
          SCENARIO_ID: "8132416"
        run: python3 tools/zx_poster.py
